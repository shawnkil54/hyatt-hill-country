name: Extract project ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          if [ ! -f hill-country-guide-github-ready.zip ]; then
            echo "ZIP already extracted. Nothing to do."
            exit 0
          fi

          unzip -o hill-country-guide-github-ready.zip -d .
          rm hill-country-guide-github-ready.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract Hyatt Hill Country Guide project"
          git push
